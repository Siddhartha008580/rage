[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rage"
version = "0.1.0"
description = "Local-first hybrid RAG, document ingestion, MCP server, and document generation pipeline"
readme = "STARTUP.md"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0",
    "docling-core>=2.0",
    "mineru>=4.0,<5",
    "PyYAML>=6.0",
    "rapidfuzz>=3.0",
    "groq>=0.11",
    "pdfplumber>=0.11",
    "camelot-py>=2.0,<3",
    "unstructured[pdf]>=0.18.32",
    "PyMuPDF>=1.24",
    "pymupdf4llm>=0.0.17",
    "transformers>=4.40,<6",
    "torchvision>=0.15",
    "timm>=0.9",
    "openpyxl>=3.1",
    "chromadb>=0.5",
    "mcp>=1.0,<2",
    "httpx>=0.27",
    "openai>=1.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scipy>=1.10",
    "tiktoken>=0.7",
    "langchain-chroma>=0.2",
    "langchain-classic>=1.0",
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
